name: Build APK and create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — the APK would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Verify the APK is signed with the expected key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # A debug-signed APK here would mean the signing config silently fell through.
          if "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed — release signing config was not applied."
            exit 1
          fi

      - name: Rename APK with version
        id: rename
        run: |
          # Tags give v1.4.0 -> 1.4.0; a branch dispatch gives feat/foo, and the slash
          # would be read as a directory by mv, so flatten it.
          VERSION="$(echo "${GITHUB_REF_NAME#v}" | tr '/' '-')"
          [ -z "$VERSION" ] && VERSION="dev"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/xkeen-android-${VERSION}.apk"
          echo "apk_path=app/build/outputs/apk/release/xkeen-android-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkeen-android-apk
          path: ${{ steps.rename.outputs.apk_path }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
