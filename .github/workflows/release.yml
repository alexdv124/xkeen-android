name: Build APK and create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare real Xray transport tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/xray-tests"
          gh release download v26.11.9 --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip' --dir "$RUNNER_TEMP/xray-tests"
          unzip -q "$RUNNER_TEMP/xray-tests/Xray-linux-64.zip" -d "$RUNNER_TEMP/xray-tests"
          chmod +x "$RUNNER_TEMP/xray-tests/xray"
          echo "XRAY_TEST_BINARY=$RUNNER_TEMP/xray-tests/xray" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — the APK would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Verify the APK is signed with the expected key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # A debug-signed APK here would mean the signing config silently fell through.
          if "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed — release signing config was not applied."
            exit 1
          fi

      - name: Rename APK with version
        id: rename
        run: |
          # Tags give v1.4.0 -> 1.4.0; a branch dispatch gives feat/foo, and the slash
          # would be read as a directory by mv, so flatten it.
          VERSION="$(echo "${GITHUB_REF_NAME#v}" | tr '/' '-')"
          [ -z "$VERSION" ] && VERSION="dev"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/xkeen-android-${VERSION}.apk"
          echo "apk_path=app/build/outputs/apk/release/xkeen-android-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify upgrade compatibility with previous release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.rename.outputs.apk_path }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PREVIOUS_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
          mkdir -p "$PREVIOUS_DIR"
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$PREVIOUS_DIR"
          previous_apks=("$PREVIOUS_DIR"/*.apk)
          if [ "${#previous_apks[@]}" -ne 1 ] || [ ! -f "${previous_apks[0]}" ]; then
            echo "::error::Expected exactly one previous APK for compatibility verification."
            exit 1
          fi
          PREVIOUS_APK="${previous_apks[0]}"
          # SDK versions print either "Signer #1" or "V3.0 Signer" prefixes.
          # Compare the unique certificate digests, independent of the label.
          previous_cert=$("$BUILD_TOOLS/apksigner" verify --print-certs "$PREVIOUS_APK" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)
          current_cert=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)
          if [ -z "$previous_cert" ] || [ "$previous_cert" != "$current_cert" ]; then
            echo "::error::Signing certificate differs from $PREVIOUS_TAG; an in-place update would fail."
            exit 1
          fi
          previous_meta=$("$BUILD_TOOLS/aapt" dump badging "$PREVIOUS_APK" | sed -n '1p')
          current_meta=$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n '1p')
          previous_package=$(echo "$previous_meta" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          current_package=$(echo "$current_meta" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          previous_code=$(echo "$previous_meta" | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p")
          current_code=$(echo "$current_meta" | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p")
          current_version=$(echo "$current_meta" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          if [ -z "$current_package" ] || [ "$previous_package" != "$current_package" ] ||
             [ -z "$previous_code" ] || [ -z "$current_code" ] || [ "$current_code" -le "$previous_code" ]; then
            echo "::error::Package identity or versionCode does not allow an update from $PREVIOUS_TAG."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$current_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::APK versionName does not match the release tag."
            exit 1
          fi
          echo "Verified update from $PREVIOUS_TAG: $current_package, versionCode $previous_code -> $current_code, same signing certificate."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkeen-android-apk
          path: ${{ steps.rename.outputs.apk_path }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
